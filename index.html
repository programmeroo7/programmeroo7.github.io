<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rohit Kumar — Frontend Engineer</title>
<style>
html,body{margin:0;height:100%;background:#0a0705;color:#80735c;
font:300 12px/1.6 ui-sans-serif,system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase}
#l{position:fixed;inset:0;display:grid;place-items:center}
</style>
</head>
<body>
<div id="l">Connecting…</div>
<script>
(function(){
  var B='_build/';
  function pad(i){return (i<10?'0':'')+i}
  function grab(p,n){
    var out=[],chain=Promise.resolve();
    for(var i=0;i<n;i++)(function(i){
      chain=chain.then(function(){
        return fetch(B+p+pad(i)).then(function(r){
          if(!r.ok)throw new Error(p+i);
          return r.text();
        }).then(function(t){out[i]=t.trim()});
      });
    })(i);
    return chain.then(function(){return out.join('')});
  }
  Promise.all([grab('idx',18),grab('por',11)]).then(function(v){
    var bin=atob(v[0]),u8=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    var html=new TextDecoder().decode(u8);
    html=html.replace('assets/portrait.webp','data:image/webp;base64,'+v[1]);
    document.open();document.write(html);document.close();
  }).catch(function(e){
    document.getElementById('l').textContent='Load failed';
  });
})();
</script>
</body>
</html>
